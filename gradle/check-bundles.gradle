import java.nio.charset.StandardCharsets
import java.util.regex.Pattern

tasks.register('checkBundles') {
    group = 'verification'
    description = 'Verifies localization bundles against bundle.properties for missing, obsolete, duplicate, and untranslated keys.'

    def bundlesDir = file("${rootProject.projectDir}/assets/bundles")
    def baseFile = new File(bundlesDir, "bundle.properties")
    def allowlistFile = new File(bundlesDir, "untranslated-allowlist.txt")
    def localeFiles = fileTree(dir: bundlesDir, include: 'bundle_*.properties')
    def reportFile = layout.buildDirectory.file("reports/bundles/checkBundles.md")

    inputs.file(baseFile)
    if (allowlistFile.exists()) {
        inputs.file(allowlistFile)
    }
    inputs.files(localeFiles)
    outputs.file(reportFile)

    doLast {
        if (!baseFile.exists()) {
            throw new GradleException("Base bundle file not found at: ${baseFile.absolutePath}")
        }

        def placeholderPattern = Pattern.compile("\\{(\\d+)\\}")
        def urlPattern = Pattern.compile("^https?://.*\$")
        def numericPunctPattern = Pattern.compile("^[0-9\\s.,:%/\\-_()#\\[\\]+*!?@^<>=|\\\\~`'\"]+\$")
        def formatTokenPattern = Pattern.compile("^(\\[#[0-9a-fA-F]{6,8}\\])?\\{[0-9]+\\}[a-zA-Z%]*\$")

        // English stop-words that indicate natural language prose/sentences.
        // A special term / acronym / proper noun should NEVER contain these words.
        def englishStopWords = [
            'the', 'be', 'to', 'of', 'and', 'a', 'in', 'that', 'have', 'i', 'it', 'for', 'not', 'on', 'with',
            'he', 'as', 'you', 'do', 'at', 'this', 'but', 'his', 'by', 'from', 'they', 'we', 'say', 'her', 'she',
            'or', 'an', 'will', 'my', 'one', 'all', 'would', 'there', 'their', 'what', 'so', 'up', 'out', 'if',
            'about', 'who', 'get', 'which', 'go', 'me', 'when', 'make', 'can', 'like', 'time', 'no', 'just', 'him',
            'know', 'take', 'people', 'into', 'year', 'your', 'good', 'some', 'could', 'them', 'see', 'other',
            'than', 'then', 'now', 'look', 'only', 'come', 'its', 'over', 'think', 'also', 'back', 'after', 'use',
            'two', 'how', 'our', 'work', 'first', 'well', 'way', 'even', 'new', 'want', 'because', 'any', 'these',
            'give', 'day', 'most', 'us', 'please', 'failed', 'failure', 'success', 'cannot', 'select', 'click',
            'press', 'drag', 'toggle', 'enable', 'disable', 'error', 'warning', 'display', 'message', 'window',
            'dialog', 'button', 'settings', 'feature', 'requires', 'current', 'latest', 'version', 'available'
        ] as Set

        // Load allowlist
        def allowlist = [] as Set<String>
        if (allowlistFile.exists()) {
            allowlistFile.eachLine('UTF-8') { line ->
                def trimmed = line.trim()
                if (!trimmed.isEmpty() && !trimmed.startsWith('#') && !trimmed.startsWith('!')) {
                    // Extract key (ignoring any trailing whitespace/comments)
                    def key = trimmed.split('\\s+')[0].trim()
                    if (!key.isEmpty()) {
                        allowlist.add(key)
                    }
                }
            }
        }

        // Helper to parse bundle file with duplicate detection
        def parseBundle = { File f ->
            def keys = [] as List
            def entries = [:] as Map<String, String>
            def lineNumbers = [:] as Map<String, List<Integer>>
            int lineNum = 0

            f.eachLine('UTF-8') { rawLine ->
                lineNum++
                def line = rawLine.trim()
                if (line.isEmpty() || line.startsWith('#') || line.startsWith('!')) {
                    return
                }
                int eqIdx = line.indexOf('=')
                if (eqIdx == -1) {
                    return
                }
                def key = line.substring(0, eqIdx).trim()
                def val = line.substring(eqIdx + 1).trim()

                if (!lineNumbers.containsKey(key)) {
                    lineNumbers[key] = []
                    keys.add(key)
                }
                lineNumbers[key].add(lineNum)
                entries[key] = val
            }
            return [file: f, keys: keys, entries: entries, lineNumbers: lineNumbers]
        }

        def extractPlaceholders = { String val ->
            def matcher = placeholderPattern.matcher(val)
            def result = [] as List<Integer>
            while (matcher.find()) {
                result.add(Integer.parseInt(matcher.group(1)))
            }
            result.sort()
            return result
        }

        def isUniversalToken = { String val ->
            if (val.isEmpty()) return true
            if (urlPattern.matcher(val).matches()) return true
            if (formatTokenPattern.matcher(val).matches()) return true
            if (numericPunctPattern.matcher(val).matches()) return true
            return false
        }

        def errors = [] as List<String>
        def tableRows = [] as List<Map>

        // 1. Parse base bundle
        def baseData = parseBundle(baseFile)
        def baseKeySet = baseData.entries.keySet()

        // Check duplicates in base
        baseData.lineNumbers.each { key, lines ->
            if (lines.size() > 1) {
                errors.add("Base bundle '${baseFile.name}' has duplicate key '${key}' at lines ${lines}")
            }
        }

        // 2. Anti-Laziness Guard: Validate entries in allowlist
        allowlist.each { key ->
            if (!baseData.entries.containsKey(key)) {
                errors.add("[ALLOWLIST] Key '${key}' in ${allowlistFile.name} does not exist in ${baseFile.name}")
                return
            }
            def englishText = baseData.entries[key]
            def words = englishText.toLowerCase().split("[^a-z0-9]+")
            for (String w : words) {
                if (englishStopWords.contains(w)) {
                    errors.add("[ANTI-LAZINESS] Key '${key}' in ${allowlistFile.name} cannot be ignored: English text '${englishText}' contains English word '${w}'. It must be translated into the target language.")
                    break
                }
            }
        }

        tableRows.add([
            file: baseFile.name,
            total: baseKeySet.size(),
            missing: 0,
            obsolete: 0,
            untranslated: 0,
            status: errors.isEmpty() ? '✅ Valid Base' : '❌ Error'
        ])

        // 3. Check each locale bundle
        def targetFiles = localeFiles.files.sort { a, b -> a.name <=> b.name }
        targetFiles.each { File locFile ->
            def locData = parseBundle(locFile)
            def locKeySet = locData.entries.keySet()

            // Check duplicates in locale
            locData.lineNumbers.each { key, lines ->
                if (lines.size() > 1) {
                    errors.add("${locFile.name}: Duplicate key '${key}' at lines ${lines}")
                }
            }

            // Check missing keys (in base but not in locale)
            def missingKeys = baseKeySet - locKeySet
            if (!missingKeys.isEmpty()) {
                errors.add("${locFile.name}: Missing ${missingKeys.size()} keys from base bundle: ${missingKeys.take(10).join(', ')}${missingKeys.size() > 10 ? '...' : ''}")
            }

            // Check obsolete / extra keys (in locale but not in base)
            def obsoleteKeys = locKeySet - baseKeySet
            if (!obsoleteKeys.isEmpty()) {
                errors.add("${locFile.name}: Contains ${obsoleteKeys.size()} obsolete keys not found in base bundle: ${obsoleteKeys.join(', ')}")
            }

            // Check placeholder syntax consistency & untranslated keys
            int untranslatedCount = 0
            def untranslatedKeys = [] as List<String>

            locData.entries.each { key, locVal ->
                if (baseData.entries.containsKey(key)) {
                    def baseVal = baseData.entries[key]
                    def basePh = extractPlaceholders(baseVal)
                    def locPh = extractPlaceholders(locVal)

                    if (basePh != locPh) {
                        errors.add("${locFile.name}: Key '${key}' placeholder mismatch: base=${basePh} != translation=${locPh}")
                    }

                    // Untranslated check: identical to English base
                    if (locVal.equals(baseVal)) {
                        if (!isUniversalToken(locVal) && !allowlist.contains(key)) {
                            untranslatedCount++
                            untranslatedKeys.add(key)
                        }
                    }
                }
            }

            if (untranslatedCount > 0) {
                errors.add("${locFile.name}: ${untranslatedCount} untranslated key(s) identical to English: ${untranslatedKeys.take(10).join(', ')}${untranslatedKeys.size() > 10 ? '...' : ''}. AI translation must not lazily copy English. Either translate them or, if they are legitimate special terms, add them to untranslated-allowlist.txt.")
            }

            def hasFileErrors = errors.any { it.startsWith(locFile.name) }
            tableRows.add([
                file: locFile.name,
                total: locKeySet.size(),
                missing: missingKeys.size(),
                obsolete: obsoleteKeys.size(),
                untranslated: untranslatedCount,
                status: hasFileErrors ? '❌ Failed' : '✅ Pass'
            ])
        }

        // 4. Build markdown report
        def sb = new StringBuilder()
        sb.append("### 🌐 Localization Bundle Verification Report\n\n")
        sb.append("| Bundle File | Total Keys | Missing | Obsolete | Untranslated | Status |\n")
        sb.append("| :--- | :---: | :---: | :---: | :---: | :---: |\n")
        tableRows.each { r ->
            sb.append("| `${r.file}` | ${r.total} | ${r.missing} | ${r.obsolete} | ${r.untranslated} | ${r.status} |\n")
        }
        sb.append("\n")

        if (!errors.isEmpty()) {
            sb.append("#### ❌ Errors (${errors.size()})\n")
            errors.each { sb.append("- ${it}\n") }
            sb.append("\n")
        }

        // Print to console
        logger.lifecycle("================================================================================")
        logger.lifecycle("BUNDLE VERIFICATION SUMMARY")
        logger.lifecycle("================================================================================")
        tableRows.each { r ->
            logger.lifecycle(String.format("  %-25s | Total: %4d | Missing: %3d | Obsolete: %3d | Untranslated: %3d | %s",
                r.file, r.total, r.missing, r.obsolete, r.untranslated, r.status))
        }
        logger.lifecycle("================================================================================")

        // Save report file
        def outReport = reportFile.get().asFile
        outReport.parentFile.mkdirs()
        outReport.text = sb.toString()

        // GitHub Step Summary if running in GitHub Actions
        def ghSummaryPath = System.getenv("GITHUB_STEP_SUMMARY")
        if (ghSummaryPath) {
            try {
                new File(ghSummaryPath).append(sb.toString())
            } catch (Exception e) {
                logger.warn("Could not write to GITHUB_STEP_SUMMARY: ${e.message}")
            }
        }

        // Fail build if errors exist
        if (!errors.isEmpty()) {
            logger.error("Bundle verification failed with ${errors.size()} error(s):")
            errors.each { logger.error("  [ERROR] ${it}") }
            throw new GradleException("Localization bundle verification failed with ${errors.size()} error(s). See summary above.")
        }
    }
}
