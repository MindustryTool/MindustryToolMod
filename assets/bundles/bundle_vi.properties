# ─── Nâng Cấp Thông Minh (Smart Upgrade) ─────────────────────────
# Tên hiển thị của tính năng Nâng Cấp Thông Minh.
# Hiển thị trên thẻ tính năng trong danh sách cài đặt tính năng.
feature.smart-upgrade.name=Nâng Cấp Thông Minh
# Mô tả ngắn gọn về tính năng Nâng Cấp Thông Minh.
# Hiển thị dưới tên tính năng trong danh sách cài đặt tính năng.
feature.smart-upgrade.description=Nâng cấp hàng loạt băng chuyền, ống dẫn, cầu dẫn, tường và máy khoan kết nối với nhau.
# Hướng dẫn chi tiết cách sử dụng tính năng Nâng Cấp Thông Minh.
# Hiển thị trong hộp thoại Trợ giúp tính năng.
feature.smart-upgrade.help=Chạm vào nút Nâng Cấp Thông Minh trên thanh QuickAccess để sẵn sàng, sau đó chạm vào một công trình để mở bảng chọn nâng cấp hàng loạt các băng chuyền, ống dẫn, cầu dẫn, máy khoan hoặc tường được kết nối. Bạn cũng có thể nhấn U khi đang trỏ vào công trình.
# Tiêu đề của hộp thoại Cài Đặt Nâng Cấp Thông Minh.
# Hiển thị ở phần đầu của hộp thoại cài đặt.
feature.smart-upgrade.settings.title=Cài Đặt Nâng Cấp Thông Minh
# Nhãn cho nút khôi phục các cài đặt nâng cấp thông minh về mặc định.
# Hiển thị trên nút đặt lại trong SmartUpgradeSettingsDialog.
feature.smart-upgrade.settings.reset=Khôi phục mặc định
# Nhãn cho thanh trượt cài đặt số lượng công trình nâng cấp tối đa mỗi lần thực thi.
# Hiển thị trong SmartUpgradeSettingsDialog.
feature.smart-upgrade.settings.max-upgrades=Số công trình tối đa mỗi lần nâng cấp
# Nhãn cho tùy chọn thời gian duy trì trạng thái sẵn sàng.
# Hiển thị trong SmartUpgradeSettingsDialog.
feature.smart-upgrade.settings.trigger-mode=Chế Độ Kích Hoạt
# Tùy chọn tự động hủy sẵn sàng sau khi mở một bảng nâng cấp.
# Hiển thị trên nút một lần trong SmartUpgradeSettingsDialog.
feature.smart-upgrade.settings.trigger-mode.one-shot=Một lần
# Tùy chọn duy trì sẵn sàng qua nhiều bảng nâng cấp cho đến khi hủy thủ công.
# Hiển thị trên nút duy trì trong SmartUpgradeSettingsDialog.
feature.smart-upgrade.settings.trigger-mode.persistent=Duy trì
# Thông báo nổi hiển thị khi Nâng Cấp Thông Minh đã sẵn sàng chờ chạm một lần.
# Hiển thị trên màn hình sau khi chạm vào biểu tượng QuickAccess của Nâng Cấp Thông Minh.
feature.smart-upgrade.armed=Đã sẵn sàng Nâng Cấp Thông Minh: chạm vào một công trình để mở bảng nâng cấp.
# Nhãn hộp kiểm chỉ thay thế các công trình cùng loại chính xác.
# Hiển thị trong SmartUpgradeSettingsDialog.
feature.smart-upgrade.settings.only-same-type=Chỉ thay thế công trình cùng loại chính xác
# Nhãn hộp kiểm cho phép thuật toán duyệt qua cầu nối và mối nối.
# Hiển thị trong SmartUpgradeSettingsDialog.
feature.smart-upgrade.settings.traverse-bridges=Duyệt qua cầu nối và mối nối
# Thông báo nổi hiển thị khi không tìm thấy công trình phù hợp để nâng cấp.
# Hiển thị trên màn hình khi người chơi kích hoạt nâng cấp.
feature.smart-upgrade.no-candidates=Không có công trình nâng cấp phù hợp.
# Thông báo nổi hiển thị khi người chơi không có đơn vị xây dựng nào khả dụng.
# Hiển thị trên màn hình khi người chơi kích hoạt nâng cấp.
feature.smart-upgrade.no-builder=Không có đơn vị xây dựng khả dụng.
# Thông báo nổi thông báo số lượng công trình đã được xếp hàng nâng cấp.
# {0} là số lượng khối được nâng cấp, {1} là tên khối đích.
feature.smart-upgrade.upgraded=Đã nâng cấp {0} khối sang {1}

