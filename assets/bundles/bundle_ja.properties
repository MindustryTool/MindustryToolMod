# Help text explaining how to use the Emoji feature.
# Displayed in FeatureHelpDialog when inspecting the emoji feature.
feature.emoji.help=機能カードまたはクイックアクセスバーから絵文字ダイアログを開きます。検索欄に入力してグリフ名で絞り込み、グリフチップをクリックするとクリップボードにコピーされ、チャット、設計図、ラベル等で使用できます。
# Title of the dialog for browsing emoji glyphs.
# Displayed as the header of EmojiDialog.
feature.emoji.title=絵文字
# Placeholder text for the search field in the Emoji dialog.
# Displayed inside the search input when it is empty.
feature.emoji.search=検索...
# Message shown when no glyph matches the search query.
# Displayed centered in the Emoji dialog instead of glyph chips.
feature.emoji.empty=絵文字が見つかりません。
# Toast shown after a glyph is copied to the clipboard.
# Displayed briefly at the bottom of the screen; {0} is the Iconc field name of the copied glyph.
feature.emoji.copied={0} をコピーしました

# Display name of the Screenshot feature.
# Displayed on the feature card in FeatureSettingDialog.
feature.screenshot.name=スクリーンショット
# Short description of the Screenshot feature.
# Displayed on the feature card in FeatureSettingDialog.
feature.screenshot.description=UIを含めるか除外してゲーム画面を撮影します。
# Help text explaining how to use the Screenshot feature.
# Displayed in FeatureHelpDialog when inspecting the screenshot feature.
feature.screenshot.help=クイックアクセスアイコンをクリックすると、現在の設定で即座にスクリーンショットを撮影します。長押しすると設定を開き、UIを含めるかどうかを切り替えられます。
# Title of the settings dialog for configuring screenshot options.
# Displayed as the header of ScreenshotSettingsDialog.
feature.screenshot.settings.title=スクリーンショット設定
# Label for the toggle that includes UI elements in captures.
# Displayed as a checkbox; when off, captures a clean frame without HUD or dialogs.
feature.screenshot.settings.include-ui=スクリーンショットにUIを含める
# Label for the button that captures immediately.
# Displayed at the bottom of the settings dialog.
feature.screenshot.settings.capture-now=今すぐ撮影
# Label for the button that opens the screenshots folder.
# Displayed below the capture button; opens the standard screenshots directory in the system file manager.
feature.screenshot.settings.open-folder=スクリーンショットフォルダを開く
# Label for the button that resets screenshot options to defaults.
# Displayed on the reset button in ScreenshotSettingsDialog.
feature.screenshot.settings.reset=デフォルトに戻す
# Toast confirming a screenshot was saved.
# Displayed briefly via showInfoFade; {0} is the saved file name.
feature.screenshot.success.text=スクリーンショットを保存しました: {0}
# Toast shown when the screenshots folder cannot be opened and its path is copied instead.
# Displayed briefly when Core.app.openFolder fails on the platform.
feature.screenshot.success.copied=フォルダを開けませんでした。パスをクリップボードにコピーしました。
# Error shown when PNG writing fails.
# Displayed as an error message; {0} is the underlying exception message.
feature.screenshot.error.write=スクリーンショットを保存できませんでした: {0}

# ─── Feature Keybinds ──────────────────────────────────────────

# Display name of the MindustryTool keybind category.
# Displayed as the section header grouping all mod hotkeys in Mindustry's vanilla Rebind Keys dialog (Settings -> Controls).
section.MindustryTool.name=MindustryTool

# Display name of the schematic browser dialog hotkey.
# Displayed in Mindustry's vanilla Rebind Keys dialog under the MindustryTool section; triggers opening the schematic browser.
keybind.schematicBrowser.name=設計図ブラウザ

# Display name of the map browser dialog hotkey.
# Displayed in Mindustry's vanilla Rebind Keys dialog under the MindustryTool section; triggers opening the map browser.
keybind.mapBrowser.name=マップブラウザ

# Display name of the autoplay toggle hotkey.
# Displayed in Mindustry's vanilla Rebind Keys dialog under the MindustryTool section; toggles the autoplay feature on and off.
keybind.autoPlay.name=自動プレイ切り替え

# Display name of the chat overlay toggle hotkey.
# Displayed in Mindustry's vanilla Rebind Keys dialog under the MindustryTool section; toggles the global chat overlay collapsed state.
keybind.chatOverlay.name=チャットオーバーレイ切り替え

# Display name of the time control pause hotkey.
# Displayed in Mindustry's vanilla Rebind Keys dialog under the MindustryTool section; pauses or resumes game speed while hosting.
keybind.timecontrolPause.name=時間の一時停止 / 再開

# Display name of the time control speed up hotkey.
# Displayed in Mindustry's vanilla Rebind Keys dialog under the MindustryTool section; increases game speed to the next preset or slider step.
keybind.timecontrolSpeedUp.name=時間を加速

# Display name of the time control slow down hotkey.
# Displayed in Mindustry's vanilla Rebind Keys dialog under the MindustryTool section; decreases game speed to the previous preset or slider step.
keybind.timecontrolSpeedDown.name=時間を減速

# Display name of the screenshot capture hotkey.
# Displayed in Mindustry's vanilla Rebind Keys dialog under the MindustryTool section; immediately captures an in-game screenshot.
keybind.screenshotCapture.name=スクリーンショット撮影

# Display name of the screenshot settings dialog hotkey.
# Displayed in Mindustry's vanilla Rebind Keys dialog under the MindustryTool section; opens the screenshot configuration dialog.
keybind.screenshotSettings.name=スクリーンショット設定

# Display name of the range display toggle hotkey.
# Displayed in Mindustry's vanilla Rebind Keys dialog under the MindustryTool section; toggles the range display overlay on and off.
keybind.rangeDisplay.name=射程表示切り替え

# Display name of the range display settings dialog hotkey.
# Displayed in Mindustry's vanilla Rebind Keys dialog under the MindustryTool section; opens the range display configuration dialog.
keybind.rangeDisplaySettings.name=射程表示設定

# Display name of the health bars toggle hotkey.
# Displayed in Mindustry's vanilla Rebind Keys dialog under the MindustryTool section; toggles unit and building health bars on and off.
keybind.healthBar.name=耐久バー切り替え

# Display name of the health bar settings dialog hotkey.
# Displayed in Mindustry's vanilla Rebind Keys dialog under the MindustryTool section; opens the health bar configuration dialog.
keybind.healthBarSettings.name=耐久バー設定

# Display name of the visualizer toggle hotkey.
# Displayed in Mindustry's vanilla Rebind Keys dialog under the MindustryTool section; toggles tactical visualizations on and off.
keybind.visualizer.name=ビジュアライザー切り替え

# Display name of the visualizer settings dialog hotkey.
# Displayed in Mindustry's vanilla Rebind Keys dialog under the MindustryTool section; opens the visualizer configuration dialog.
keybind.visualizerSettings.name=ビジュアライザー設定

# Display name of the wave preview toggle hotkey.
# Displayed in Mindustry's vanilla Rebind Keys dialog under the MindustryTool section; toggles the wave composition preview panel on and off.
keybind.wavePreview.name=ウェーブプレビュー切り替え

# Display name of the wave preview settings dialog hotkey.
# Displayed in Mindustry's vanilla Rebind Keys dialog under the MindustryTool section; opens the wave preview configuration dialog.
keybind.wavePreviewSettings.name=ウェーブプレビュー設定

# Display name of the Quick Schematic Grid feature.
# Shown on its card in the feature settings grid.
feature.quick-schematic-grid.name=クイック設計図グリッド

# Short description of the Quick Schematic Grid feature.
# Shown under its name on its card in the feature settings grid.
feature.quick-schematic-grid.description=HUDやポップアップからワンクリックでお気に入りの設計図にアクセスできます。

# Help text explaining how to use the Quick Schematic Grid feature.
# Displayed in FeatureHelpDialog when inspecting the quick-schematic-grid feature.
feature.quick-schematic-grid.help=お気に入りの設計図を登録し、1クリックで素早く配置できるようにします。常時表示のドラッグ可能なグリッドとしてHUDを選択するか、必要な時だけ呼び出すクイックアクセスポップアップを選択できます。ゲーム内でボタンをクリックして設計図を配置します。

# Title of the settings dialog for configuring the Quick Schematic Grid.
# Displayed as the header of QuickSchematicGridSettingsDialog.
feature.quick-schematic-grid.settings.title=クイック設計図グリッド設定

# Label for the display-mode selector in settings.
# Displayed next to the HUD and popup toggle buttons.
feature.quick-schematic-grid.settings.display-mode=表示モード

# Label for the HUD display-mode toggle button in settings.
# Displayed on the button that selects the always-visible draggable HUD surface.
feature.quick-schematic-grid.settings.display-mode.hud=HUD

# Label for the popup display-mode toggle button in settings.
# Displayed on the button that selects the on-demand QuickAccess popup surface.
feature.quick-schematic-grid.settings.display-mode.popup=ポップアップ

# Label for the columns slider in settings.
# Displayed next to the slider; range 1 to 10 controls grid columns per row.
feature.quick-schematic-grid.settings.cols=列数

# Label for the button size slider in settings.
# Displayed next to the slider; controls width and height of each schematic button.
feature.quick-schematic-grid.settings.button-size=ボタンサイズ

# Label for the button gap slider in settings.
# Displayed next to the slider; range 0px to 16px controls spacing between buttons.
feature.quick-schematic-grid.settings.button-gap=ボタンの間隔

# Section header for the configured schematic entries list in settings.
# Displayed above the grid of configured schematic slots.
feature.quick-schematic-grid.settings.entries=設計図

# Empty state text shown when no schematics are configured yet.
# Displayed centered in the entries list area of the settings view.
feature.quick-schematic-grid.settings.empty=設計図がまだ登録されていません。下から追加してください。

# Label for the button that opens the schematic picker to add a new entry.
# Displayed on the add button at the end of the entries list.
feature.quick-schematic-grid.settings.add=+ 設計図を追加

# Tooltip for the button that moves an entry earlier in the list order.
# Displayed when hovering the left chevron button on a configured entry row.
feature.quick-schematic-grid.button.move-left=前に移動

# Tooltip for the button that moves an entry later in the list order.
# Displayed when hovering the right chevron button on a configured entry row.
feature.quick-schematic-grid.button.move-right=後ろに移動

# Tooltip for the button that removes an entry from the list.
# Displayed when hovering the remove button on a configured entry row.
feature.quick-schematic-grid.button.remove=削除

# Label for the button that resets the HUD position back to default.
# Displayed on the reset position button in settings.
feature.quick-schematic-grid.settings.reset-position=HUD位置をリセット

# Title of the schematic picker dialog.
# Displayed as the header of SchematicPickerDialog.
feature.quick-schematic-grid.picker.title=設計図を選択

# Placeholder text displayed in the picker search field when empty.
# Shown inside the search input of SchematicPickerDialog.
feature.quick-schematic-grid.picker.search=設計図を検索...

# Empty state shown when no local schematics match the picker search or tag filter.
# Displayed centered in the picker grid area.
feature.quick-schematic-grid.picker.empty=設計図が見つかりません。

# Label for the tag chip that clears tag filtering in the picker.
# Displayed as the first chip before individual tag chips.
feature.quick-schematic-grid.picker.tag.all=すべて

# Tooltip shown on grid buttons for configured schematics.
# {0} is the schematic display name. Displayed when hovering a HUD or popup button.
feature.quick-schematic-grid.tooltip.use={0}

# Tooltip shown on grid buttons whose linked schematic is missing.
# {0} is the configured schematic name. Displayed when hovering a broken slot.
feature.quick-schematic-grid.tooltip.missing=見つかりません: {0}

# Warning shown when a grid button is clicked but its schematic no longer exists.
# Displayed as an info toast; the slot stays disabled until reconfigured.
feature.quick-schematic-grid.warning.missing=設計図が見つかりません。削除または名前が変更された可能性があります。

# Warning shown when schematics are prohibited by the current map rules.
# Displayed as an info toast instead of activating placement.
feature.quick-schematic-grid.warning.disabled=現在のマップルールにより設計図の使用が禁止されています。

# Guidance shown inside the HUD and popup grids when no entries are configured.
# Displayed in place of the button grid; directs the player to the settings dialog.
feature.quick-schematic-grid.hud.empty=空です。設定を開いて設計図を追加してください。

# Title of the delete confirmation dialog for a configured entry.
# Displayed as the header of the Vars.ui.showConfirm prompt.
feature.quick-schematic-grid.delete.title=設計図を削除しますか？

# Confirmation message asking whether to remove a configured entry.
# Displayed in the Vars.ui.showConfirm prompt; {0} is the entry display name.
feature.quick-schematic-grid.delete.message=クイックグリッドから「{0}」を削除しますか？

# Title of the slot edit dialog for a configured entry.
# Displayed as the header of the edit dialog opened from the pencil button.
feature.quick-schematic-grid.edit.title=スロットを編集

# Label for the custom display label field in the slot edit dialog.
# Displayed above the text input; empty means the schematic name is shown.
feature.quick-schematic-grid.edit.label=カスタムラベル

# Placeholder shown inside the custom label field when empty.
# Displayed as faint hint text in the label input of the edit dialog.
feature.quick-schematic-grid.edit.label.hint=空欄の場合は設計図名を使用します

# Label for the linked schematic row in the slot edit dialog.
# Displayed above the thumbnail; tapping the thumbnail re-picks the schematic.
feature.quick-schematic-grid.edit.schematic=設計図 (タップして変更)

# Label for the custom icon row in the slot edit dialog.
# Displayed above the current icon preview and pick/clear buttons.
feature.quick-schematic-grid.edit.icon=カスタムアイコン

# Label for the button that opens the icon picker from the edit dialog.
# Displayed on the pick button next to the current icon preview.
feature.quick-schematic-grid.edit.icon.pick=アイコンを選択

# Label for the button that clears the custom icon in the edit dialog.
# Displayed on the clear button; restores the schematic preview.
feature.quick-schematic-grid.edit.icon.clear=クリア

# Label shown when a slot has no custom icon configured.
# Displayed in place of the icon preview in the edit dialog.
feature.quick-schematic-grid.edit.icon.none=なし (設計図プレビューを使用)

# Title of the icon picker dialog.
# Displayed as the header of the dialog opened from the slot edit dialog.
feature.quick-schematic-grid.icon.title=アイコンを選択

# Placeholder text displayed in the icon picker search field when empty.
# Shown inside the search input of the icon picker dialog.
feature.quick-schematic-grid.icon.search=アイコンを検索...

# Section header for font glyphs in the icon picker.
# Displayed above the grid of Iconc font glyph chips.
feature.quick-schematic-grid.icon.glyphs=フォントグリフ

# Section header for unlocked game content icons in the icon picker.
# Displayed above the grid of block/item emoji chips.
feature.quick-schematic-grid.icon.content=ゲームアイコン

# Empty state shown when no icons match the icon picker search query.
# Displayed centered in the icon picker instead of icon chips.
feature.quick-schematic-grid.icon.empty=アイコンが見つかりません。

# Tooltip for the per-row edit button in settings.
# Displayed when hovering the pencil button on a configured entry row.
feature.quick-schematic-grid.button.edit=スロットを編集

# Label for configuring the number of grid rows.
# Displayed in settings next to the rows slider.
feature.quick-schematic-grid.settings.rows=行数

# Section header for page management in settings.
# Displayed above the page tabs bar in QuickSchematicGridSettingsView.
feature.quick-schematic-grid.settings.pages=ページ

# Label on page tab buttons in settings.
# {0} is the 1-based page number.
feature.quick-schematic-grid.settings.page-tab={0} ページ

# Label on the button to add a new page.
# Displayed next to page tabs in QuickSchematicGridSettingsView.
feature.quick-schematic-grid.settings.add-page=+ ページを追加

# Label on the button to delete the currently active page.
# Displayed next to page tabs in QuickSchematicGridSettingsView.
feature.quick-schematic-grid.settings.delete-page=ページを削除

# Title of the confirmation dialog when deleting a page.
# Displayed in the confirmation popup header.
feature.quick-schematic-grid.delete-page.title=ページを削除しますか？

# Message inside the confirmation dialog when deleting a page.
# {0} is the 1-based page number.
feature.quick-schematic-grid.delete-page.message=ページ {0} とそこに登録されているすべての設計図を削除してもよろしいですか？

# Label on the button to clear and unassign a slot.
# Displayed at the bottom of QuickSchematicGridSlotDialog.
feature.quick-schematic-grid.edit.clear-slot=スロットをクリア

# Label for the page icon configuration row.
# Displayed in QuickSchematicGridSettingsView for the active page.
feature.quick-schematic-grid.settings.page-icon=ページアイコン

# Placeholder text shown when no custom icon is assigned to a page.
# Displayed in QuickSchematicGridSettingsView in the page icon row.
feature.quick-schematic-grid.settings.page-icon.none=なし (ページ番号を使用)

# Label on the button to pick a custom icon for the active page.
# Displayed in QuickSchematicGridSettingsView in the page icon row.
feature.quick-schematic-grid.settings.page-icon.pick=アイコンを選択

# Label on the button to clear the custom icon for the active page.
# Displayed in QuickSchematicGridSettingsView in the page icon row.
feature.quick-schematic-grid.settings.page-icon.clear=クリア

# Label for the page navigation position selector in settings.
# Displayed next to the Left, Right, Top, and Bottom toggle buttons.
feature.quick-schematic-grid.settings.page-position=ページ位置

# Label for the Left page position toggle button in settings.
# Displayed on the button that places page tabs in a vertical column on the left of the grid.
feature.quick-schematic-grid.settings.page-position.left=左

# Label for the Right page position toggle button in settings.
# Displayed on the button that places page tabs in a vertical column on the right of the grid.
feature.quick-schematic-grid.settings.page-position.right=右

# Label for the Top page position toggle button in settings.
# Displayed on the button that places page tabs in a horizontal row above the grid.
feature.quick-schematic-grid.settings.page-position.top=上

# Label for the Bottom page position toggle button in settings.
# Displayed on the button that places page tabs in a horizontal row below the grid.
feature.quick-schematic-grid.settings.page-position.bottom=下

# Label for the button opacity slider in settings.
# Displayed next to the slider; range 20% to 100% controls transparency of all HUD buttons.
feature.quick-schematic-grid.settings.button-opacity=ボタンの不透明度

# Label on the button that loads the next batch of schematics in the picker.
# Displayed below the picker grid when more filtered schematics remain; {0} is the remaining count.
feature.quick-schematic-grid.picker.load-more=さらに読み込む (残り {0} 件)

# Placeholder text shown on a schematic card while its preview texture is being generated.
# Displayed inside the preview area of SchematicPickerDialog cards queued for throttled rendering.
feature.quick-schematic-grid.picker.preview-generating=プレビューを生成中...

