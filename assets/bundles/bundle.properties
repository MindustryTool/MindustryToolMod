# Display name of the Time Control feature.
# Shown on its card in the feature settings grid.
feature.time-control.name=Time Control

# Short description of the Time Control feature.
# Shown under its name on its card in the feature settings grid.
feature.time-control.description=Control game speed with time-scale shortcuts.

# Help text explaining how to use the Time Control feature.
# Displayed in FeatureHelpDialog when inspecting the time-control feature.
feature.time-control.help=Switches game speed between slow motion and fast forward while playing. Only available while hosting or in single-player; speed resets to 1x automatically when joining as a client, leaving the world, or switching interaction modes.

# Title of the settings dialog for configuring the Time Control feature.
# Displayed as the header of TimeControlSettingsDialog.
feature.time-control.settings.title=Time Control Settings

# Label for the interaction mode selector in TimeControlSettingsDialog.
# Displayed next to the preset and slider mode toggle buttons.
feature.time-control.settings.mode=Interaction Mode

# Label for the preset interaction mode toggle button in TimeControlSettingsDialog.
# Displayed on the button that selects preset speed buttons on the HUD.
feature.time-control.settings.mode.presets=Presets

# Label for the slider interaction mode toggle button in TimeControlSettingsDialog.
# Displayed on the button that selects the speed slider on the HUD.
feature.time-control.settings.mode.slider=Slider

# Hint explaining the two interaction modes in TimeControlSettingsDialog.
# Displayed below the mode toggle buttons.
# Describes tap-to-select, tap-again-to-boost gesture, and the 1x reset exception (1x resets instead of boosting).
feature.time-control.settings.mode.hint=Presets: tap a speed to select it, tap it again to boost. Tapping 1x always resets to 1x instead of boosting. Slider: drag for any speed.

# Label for the HUD scale slider in TimeControlSettingsDialog.
# Displayed next to the scale slider; range 50% to 150%.
feature.time-control.settings.scale=Scale

# Safety note about availability in TimeControlSettingsDialog.
# Displayed as informational text above the reset buttons.
feature.time-control.settings.safety=Only works while hosting or in single-player. Speed resets to 1x automatically when unavailable.

# Label for the button that resets the current game speed back to normal.
# Displayed on the reset-speed button in TimeControlSettingsDialog.
feature.time-control.settings.reset-speed=Reset Speed to 1x

# Label for the button that resets the HUD position back to default.
# Displayed on the reset-position button in TimeControlSettingsDialog.
feature.time-control.settings.reset-position=Reset HUD Position

# Format for speed multiplier labels on the HUD.
# {0} is the multiplier value such as 1 or 0.25. Displayed on preset buttons and next to the slider.
feature.time-control.speed.format={0}x

# Tooltip for the reset button displayed in slider mode on the HUD.
# Appears when hovering over the refresh-icon button beside the speed label.
# Clicking this button resets the slider to center and returns speed to exactly 1x.
feature.time-control.slider.reset.tooltip=Reset to 1x

