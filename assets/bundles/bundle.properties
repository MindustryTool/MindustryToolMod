keybind.rangeDisplaySettings.name=Range Display Settings

# Display name of the health bars toggle hotkey.
# Displayed in Mindustry's vanilla Rebind Keys dialog under the MindustryTool section; toggles unit and building health bars on and off.
keybind.healthBar.name=Toggle Health Bars

# Display name of the health bar settings dialog hotkey.
# Displayed in Mindustry's vanilla Rebind Keys dialog under the MindustryTool section; opens the health bar configuration dialog.
keybind.healthBarSettings.name=Health Bar Settings

# Display name of the bridge visualizer toggle hotkey.
