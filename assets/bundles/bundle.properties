keybind.bridgeVisualizerSettings.name=Bridge Visualizer Settings

# Display name of the wave preview toggle hotkey.
# Displayed in Mindustry's vanilla Rebind Keys dialog under the MindustryTool section; toggles the wave composition preview panel on and off.
keybind.wavePreview.name=Toggle Wave Preview

# Display name of the wave preview settings dialog hotkey.
