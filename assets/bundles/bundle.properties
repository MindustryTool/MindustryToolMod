# Help text explaining how to use the Emoji feature.
# Displayed in FeatureHelpDialog when inspecting the emoji feature.
feature.emoji.help=Open the Emoji dialog from the feature card or Quick Access bar. Type in the search field to filter glyphs by name, then click any glyph chip to copy it to the clipboard for use in chat, schematics, and labels.
# Title of the dialog for browsing emoji glyphs.
# Displayed as the header of EmojiDialog.
feature.emoji.title=Emoji
# Placeholder text for the search field in the Emoji dialog.
# Displayed inside the search input when it is empty.
feature.emoji.search=Search...
# Message shown when no glyph matches the search query.
# Displayed centered in the Emoji dialog instead of glyph chips.
feature.emoji.empty=No emoji found.
# Toast shown after a glyph is copied to the clipboard.
# Displayed briefly at the bottom of the screen; {0} is the Iconc field name of the copied glyph.
feature.emoji.copied=Copied {0}

# Display name of the Screenshot feature.
# Displayed on the feature card in FeatureSettingDialog.
feature.screenshot.name=Screenshot
# Short description of the Screenshot feature.
# Displayed on the feature card in FeatureSettingDialog.
feature.screenshot.description=Capture the game screen with or without UI.
# Help text explaining how to use the Screenshot feature.
# Displayed in FeatureHelpDialog when inspecting the screenshot feature.
feature.screenshot.help=Click the Quick Access icon to capture immediately using current settings. Long-click to open settings and toggle UI inclusion.
# Title of the settings dialog for configuring screenshot options.
# Displayed as the header of ScreenshotSettingsDialog.
feature.screenshot.settings.title=Screenshot Settings
# Label for the toggle that includes UI elements in captures.
# Displayed as a checkbox; when off, captures a clean frame without HUD or dialogs.
feature.screenshot.settings.include-ui=Include UI in screenshots
# Label for the button that captures immediately.
# Displayed at the bottom of the settings dialog.
feature.screenshot.settings.capture-now=Capture Now
# Label for the button that opens the screenshots folder.
# Displayed below the capture button; opens the standard screenshots directory in the system file manager.
feature.screenshot.settings.open-folder=Open Screenshots Folder
# Label for the button that resets screenshot options to defaults.
# Displayed on the reset button in ScreenshotSettingsDialog.
feature.screenshot.settings.reset=Reset to Defaults
# Toast confirming a screenshot was saved.
# Displayed briefly via showInfoFade; {0} is the saved file name.
feature.screenshot.success.text=Screenshot saved: {0}
# Toast shown when the screenshots folder cannot be opened and its path is copied instead.
# Displayed briefly when Core.app.openFolder fails on the platform.
feature.screenshot.success.copied=Folder open not supported, path copied to clipboard.
# Error shown when PNG writing fails.
# Displayed as an error message; {0} is the underlying exception message.
feature.screenshot.error.write=Could not save screenshot: {0}

