keybind.wavePreviewSettings.name=Wave Preview Settings

# Display name of the Quick Schematic Grid feature.
# Shown on its card in the feature settings grid.
feature.quick-schematic-grid.name=Quick Schematic Grid

# Short description of the Quick Schematic Grid feature.
# Shown under its name on its card in the feature settings grid.
feature.quick-schematic-grid.description=One-click access to favorite schematics via HUD or popup.

# Help text explaining how to use the Quick Schematic Grid feature.
# Displayed in FeatureHelpDialog when inspecting the quick-schematic-grid feature.
feature.quick-schematic-grid.help=Configure favorite schematics for instant 1-click placement. Choose HUD for a persistent draggable grid or Popup for an on-demand QuickAccess popup. Click a button in-game to place its schematic.

# Title of the settings dialog for configuring the Quick Schematic Grid.
# Displayed as the header of QuickSchematicGridSettingsDialog.
feature.quick-schematic-grid.settings.title=Quick Schematic Grid Settings

# Label for the display-mode selector in settings.
# Displayed next to the HUD and popup toggle buttons.
feature.quick-schematic-grid.settings.display-mode=Display Mode

# Label for the HUD display-mode toggle button in settings.
# Displayed on the button that selects the always-visible draggable HUD surface.
feature.quick-schematic-grid.settings.display-mode.hud=HUD

# Label for the popup display-mode toggle button in settings.
# Displayed on the button that selects the on-demand QuickAccess popup surface.
feature.quick-schematic-grid.settings.display-mode.popup=Popup

# Label for the columns slider in settings.
# Displayed next to the slider; range 1 to 10 controls grid columns per row.
feature.quick-schematic-grid.settings.cols=Columns

# Label for the button size slider in settings.
# Displayed next to the slider; controls width and height of each schematic button.
feature.quick-schematic-grid.settings.button-size=Button Size

# Label for the button gap slider in settings.
# Displayed next to the slider; range 0px to 16px controls spacing between buttons.
feature.quick-schematic-grid.settings.button-gap=Button Gap

# Section header for the configured schematic entries list in settings.
# Displayed above the grid of configured schematic slots.
feature.quick-schematic-grid.settings.entries=Schematics

# Empty state text shown when no schematics are configured yet.
# Displayed centered in the entries list area of the settings view.
feature.quick-schematic-grid.settings.empty=No schematics configured yet. Add one below.

# Label for the button that opens the schematic picker to add a new entry.
# Displayed on the add button at the end of the entries list.
feature.quick-schematic-grid.settings.add=+ Add Schematic

# Tooltip for the button that moves an entry earlier in the list order.
# Displayed when hovering the left chevron button on a configured entry row.
feature.quick-schematic-grid.button.move-left=Move Earlier

# Tooltip for the button that moves an entry later in the list order.
# Displayed when hovering the right chevron button on a configured entry row.
feature.quick-schematic-grid.button.move-right=Move Later

# Tooltip for the button that removes an entry from the list.
# Displayed when hovering the remove button on a configured entry row.
feature.quick-schematic-grid.button.remove=Remove

# Label for the button that resets the HUD position back to default.
# Displayed on the reset position button in settings.
feature.quick-schematic-grid.settings.reset-position=Reset HUD Position

# Title of the schematic picker dialog.
# Displayed as the header of SchematicPickerDialog.
feature.quick-schematic-grid.picker.title=Select Schematic

# Placeholder text displayed in the picker search field when empty.
# Shown inside the search input of SchematicPickerDialog.
feature.quick-schematic-grid.picker.search=Search schematics...

# Empty state shown when no local schematics match the picker search or tag filter.
# Displayed centered in the picker grid area.
feature.quick-schematic-grid.picker.empty=No schematics found.

# Label for the tag chip that clears tag filtering in the picker.
# Displayed as the first chip before individual tag chips.
feature.quick-schematic-grid.picker.tag.all=All

# Tooltip shown on grid buttons for configured schematics.
# {0} is the schematic display name. Displayed when hovering a HUD or popup button.
feature.quick-schematic-grid.tooltip.use={0}

# Tooltip shown on grid buttons whose linked schematic is missing.
# {0} is the configured schematic name. Displayed when hovering a broken slot.
feature.quick-schematic-grid.tooltip.missing=Missing: {0}

# Warning shown when a grid button is clicked but its schematic no longer exists.
# Displayed as an info toast; the slot stays disabled until reconfigured.
feature.quick-schematic-grid.warning.missing=Schematic not found. It may have been deleted or renamed.

# Warning shown when schematics are prohibited by the current map rules.
# Displayed as an info toast instead of activating placement.
feature.quick-schematic-grid.warning.disabled=Schematics are disabled by the current map rules.

# Guidance shown inside the HUD and popup grids when no entries are configured.
# Displayed in place of the button grid; directs the player to the settings dialog.
feature.quick-schematic-grid.hud.empty=Empty. Open settings to add schematics.

# Title of the delete confirmation dialog for a configured entry.
# Displayed as the header of the Vars.ui.showConfirm prompt.
feature.quick-schematic-grid.delete.title=Remove Schematic?

# Confirmation message asking whether to remove a configured entry.
# Displayed in the Vars.ui.showConfirm prompt; {0} is the entry display name.
feature.quick-schematic-grid.delete.message=Remove "{0}" from the quick grid?

# Title of the slot edit dialog for a configured entry.
# Displayed as the header of the edit dialog opened from the pencil button.
feature.quick-schematic-grid.edit.title=Edit Slot

# Label for the custom display label field in the slot edit dialog.
# Displayed above the text input; empty means the schematic name is shown.
feature.quick-schematic-grid.edit.label=Custom Label

# Placeholder shown inside the custom label field when empty.
# Displayed as faint hint text in the label input of the edit dialog.
feature.quick-schematic-grid.edit.label.hint=Leave empty to use schematic name

# Label for the linked schematic row in the slot edit dialog.
# Displayed above the thumbnail; tapping the thumbnail re-picks the schematic.
feature.quick-schematic-grid.edit.schematic=Schematic (tap to change)

# Label for the custom icon row in the slot edit dialog.
# Displayed above the current icon preview and pick/clear buttons.
feature.quick-schematic-grid.edit.icon=Custom Icon

# Label for the button that opens the icon picker from the edit dialog.
# Displayed on the pick button next to the current icon preview.
feature.quick-schematic-grid.edit.icon.pick=Pick Icon

# Label for the button that clears the custom icon in the edit dialog.
# Displayed on the clear button; restores the schematic preview.
feature.quick-schematic-grid.edit.icon.clear=Clear

# Label shown when a slot has no custom icon configured.
# Displayed in place of the icon preview in the edit dialog.
feature.quick-schematic-grid.edit.icon.none=None (uses schematic preview)

# Title of the icon picker dialog.
# Displayed as the header of the dialog opened from the slot edit dialog.
feature.quick-schematic-grid.icon.title=Pick Icon

# Placeholder text displayed in the icon picker search field when empty.
# Shown inside the search input of the icon picker dialog.
feature.quick-schematic-grid.icon.search=Search icons...

# Section header for font glyphs in the icon picker.
# Displayed above the grid of Iconc font glyph chips.
feature.quick-schematic-grid.icon.glyphs=Font Glyphs

# Section header for unlocked game content icons in the icon picker.
# Displayed above the grid of block/item emoji chips.
feature.quick-schematic-grid.icon.content=Game Icons

# Empty state shown when no icons match the icon picker search query.
# Displayed centered in the icon picker instead of icon chips.
feature.quick-schematic-grid.icon.empty=No icons found.

# Tooltip for the per-row edit button in settings.
# Displayed when hovering the pencil button on a configured entry row.
feature.quick-schematic-grid.button.edit=Edit Slot

# Label for configuring the number of grid rows.
# Displayed in settings next to the rows slider.
feature.quick-schematic-grid.settings.rows=Rows

# Section header for page management in settings.
# Displayed above the page tabs bar in QuickSchematicGridSettingsView.
feature.quick-schematic-grid.settings.pages=Pages

# Label on page tab buttons in settings.
# {0} is the 1-based page number.
feature.quick-schematic-grid.settings.page-tab=Page {0}

# Label on the button to add a new page.
# Displayed next to page tabs in QuickSchematicGridSettingsView.
feature.quick-schematic-grid.settings.add-page=+ Add Page

# Label on the button to delete the currently active page.
# Displayed next to page tabs in QuickSchematicGridSettingsView.
feature.quick-schematic-grid.settings.delete-page=Delete Page

# Title of the confirmation dialog when deleting a page.
# Displayed in the confirmation popup header.
feature.quick-schematic-grid.delete-page.title=Delete Page?

# Message inside the confirmation dialog when deleting a page.
# {0} is the 1-based page number.
feature.quick-schematic-grid.delete-page.message=Are you sure you want to delete Page {0} and all its assigned schematics?

# Label on the button to clear and unassign a slot.
# Displayed at the bottom of QuickSchematicGridSlotDialog.
feature.quick-schematic-grid.edit.clear-slot=Clear Slot

# Label for the page icon configuration row.
# Displayed in QuickSchematicGridSettingsView for the active page.
feature.quick-schematic-grid.settings.page-icon=Page Icon

# Placeholder text shown when no custom icon is assigned to a page.
# Displayed in QuickSchematicGridSettingsView in the page icon row.
feature.quick-schematic-grid.settings.page-icon.none=None (uses page number)

# Label on the button to pick a custom icon for the active page.
# Displayed in QuickSchematicGridSettingsView in the page icon row.
feature.quick-schematic-grid.settings.page-icon.pick=Pick Icon

# Label on the button to clear the custom icon for the active page.
# Displayed in QuickSchematicGridSettingsView in the page icon row.
feature.quick-schematic-grid.settings.page-icon.clear=Clear

# Label for the page navigation position selector in settings.
# Displayed next to the Left, Right, Top, and Bottom toggle buttons.
feature.quick-schematic-grid.settings.page-position=Page Position

# Label for the Left page position toggle button in settings.
# Displayed on the button that places page tabs in a vertical column on the left of the grid.
feature.quick-schematic-grid.settings.page-position.left=Left

# Label for the Right page position toggle button in settings.
# Displayed on the button that places page tabs in a vertical column on the right of the grid.
feature.quick-schematic-grid.settings.page-position.right=Right

# Label for the Top page position toggle button in settings.
# Displayed on the button that places page tabs in a horizontal row above the grid.
feature.quick-schematic-grid.settings.page-position.top=Top

# Label for the Bottom page position toggle button in settings.
# Displayed on the button that places page tabs in a horizontal row below the grid.
feature.quick-schematic-grid.settings.page-position.bottom=Bottom

# Label for the button opacity slider in settings.
# Displayed next to the slider; range 20% to 100% controls transparency of all HUD buttons.
feature.quick-schematic-grid.settings.button-opacity=Button Opacity

# Label on the button that loads the next batch of schematics in the picker.
# Displayed below the picker grid when more filtered schematics remain; {0} is the remaining count.
feature.quick-schematic-grid.picker.load-more=Load More ({0} remaining)

# Placeholder text shown on a schematic card while its preview texture is being generated.
# Displayed inside the preview area of SchematicPickerDialog cards queued for throttled rendering.
feature.quick-schematic-grid.picker.preview-generating=Generating preview...

