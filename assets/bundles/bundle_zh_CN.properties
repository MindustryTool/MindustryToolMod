feature.range-display.description=显示炮塔、单位和辅助建筑的武器及增益覆盖范围。

# 解释范围显示功能的帮助文档说明。
# 在 FeatureHelpDialog 中查看范围显示功能时显示。
feature.range-display.help=实时绘制炮塔、单位、辅助建筑及敌方波次降落区域的范围圈，支持队伍颜色区分与弹药耗尽检测。

# 范围显示设置对话框的标题。
# 显示在 RangeDisplaySettingsDialog 的顶部标题栏。
feature.range-display.settings.title=范围显示设置

# RangeDisplaySettingsDialog 中不透明度滑块的标签。
# 显示在不透明度滑块旁边；范围为 10% 至 100%。
feature.range-display.settings.opacity=不透明度

# 使用虚线代替实线绘制范围指示圈的复选框标签。
# 显示在 RangeDisplaySettingsDialog 中。默认启用。
feature.range-display.settings.dashed=虚线显示

# 切换友方炮塔射程圈的复选框标签。
# 显示在 RangeDisplaySettingsDialog 中。默认启用。
feature.range-display.settings.draw-ally-turrets=显示友方炮塔射程

# 切换敌方炮塔射程圈的复选框标签。
# 显示在 RangeDisplaySettingsDialog 中。默认启用。
feature.range-display.settings.draw-enemy-turrets=显示敌方炮塔射程

# 切换友方单位武器射程圈的复选框标签。
# 显示在 RangeDisplaySettingsDialog 中。默认启用。
feature.range-display.settings.draw-ally-units=显示友方单位射程

# 切换敌方单位武器射程圈的复选框标签。
# 显示在 RangeDisplaySettingsDialog 中。默认启用。
feature.range-display.settings.draw-enemy-units=显示敌方单位射程

# 切换友方辅助建筑（投影器、驱动器、加固塔等）范围的复选框标签。
# 显示在 RangeDisplaySettingsDialog 中。默认启用。
feature.range-display.settings.draw-ally-blocks=显示友方建筑范围

# 切换敌方辅助建筑（投影器、驱动器、加固塔等）范围的复选框标签。
# 显示在 RangeDisplaySettingsDialog 中。默认启用。
feature.range-display.settings.draw-enemy-blocks=显示敌方建筑范围

# 切换生成点周围波次降落区指示圈的复选框标签。
# 显示在 RangeDisplaySettingsDialog 中。默认启用。
feature.range-display.settings.draw-spawners=显示敌军降落区域

# 将所有范围显示设置重置为默认值的按钮标签。
# 显示在 RangeDisplaySettingsDialog 的重置按钮上。
feature.range-display.settings.reset=恢复默认设置

# RangeDisplaySettingsDialog 中炮塔部分的标题。
# 显示在各个炮塔射程开关列表的上方。
feature.range-display.settings.section.turrets=炮塔

# RangeDisplaySettingsDialog 中辅助建筑部分的标题。
# 显示在各个辅助建筑范围开关列表的上方。
feature.range-display.settings.section.support-blocks=辅助建筑

# 启用该类别中所有建筑范围显示的按钮文本。
# 显示在 RangeDisplaySettingsDialog 的类别标题栏中。
feature.range-display.settings.all=全部

# 禁用该类别中所有建筑范围显示的按钮文本。
# 显示在 RangeDisplaySettingsDialog 的类别标题栏中。
feature.range-display.settings.none=无

# 炫彩聊天功能的显示名称。
# 显示在 FeatureSettingDialog 的功能卡片上。
feature.pretty-chat.name=炫彩聊天

# 炫彩聊天功能的简要描述。
# 显示在 FeatureSettingDialog 功能卡片上的名称下方。
feature.pretty-chat.description=使用多彩颜色与特殊效果美化发送的聊天消息。

# 解释炫彩聊天功能的帮助文档说明。
# 在 FeatureHelpDialog 中查看炫彩聊天功能时显示。
feature.pretty-chat.help=允许您通过可自定义的格式化流水线美化发出的聊天文本，支持彩虹渐变、UwU可爱化、波浪大小写、气泡字符以及自定义模板。

# 炫彩聊天设置对话框的标题。
# 显示在 PrettyChatSettingsDialog 的顶部标题栏。
feature.pretty-chat.settings.title=炫彩聊天设置

# 交互式消息预览输入框的标签。
# 显示在 PrettyChatSettingsView 文本输入框的上方。
feature.pretty-chat.settings.preview-label=消息预览

# 消息预览输入框为空时的占位提示文本。
# 显示在 PrettyChatSettingsView 预览输入框内部。
feature.pretty-chat.settings.preview-placeholder=输入消息以预览效果...

# 实时转换结果预览的标签。
# 显示在 PrettyChatSettingsView 转换效果文本前。
feature.pretty-chat.settings.result-label=结果：

# 文本格式化流水线列表的分区标题。
# 显示在 PrettyChatSettingsView 格式化器卡片上方。
feature.pretty-chat.settings.pipeline-title=格式化流水线

# 解释流水线如何按顺序应用格式化器的描述。
# 显示在 PrettyChatSettingsView 流水线分区标题下方。
feature.pretty-chat.settings.pipeline-desc=启用的格式化器将按照下方显示的顺序依次执行。

# 将格式化器在流水线中上移的按钮提示。
# 鼠标悬停在格式化器卡片上的向上箭头按钮时显示。
feature.pretty-chat.settings.move-up=上移

# 将格式化器在流水线中下移的按钮提示。
# 鼠标悬停在格式化器卡片上的向下箭头按钮时显示。
feature.pretty-chat.settings.move-down=下移

# 编辑自定义格式化器脚本的按钮提示。
# 鼠标悬停在可编辑格式化器卡片上的编辑按钮时显示。
feature.pretty-chat.settings.edit-script=编辑脚本

# 编辑自定义格式化器脚本或模板对话框的标题。
# 显示在 PrettyChatEditDialog 的顶部标题栏；{0} 为格式化器名称。
feature.pretty-chat.settings.edit-script-title=编辑脚本 - {0}

# 脚本编辑器中解释占位符和语法的说明文本。
# 显示在 PrettyChatEditDialog 输入框上方。
feature.pretty-chat.settings.script-hint=使用 <message> 作为聊天文本的占位符。桌面版支持 JavaScript 表达式。

# 将自定义脚本恢复为默认模板的按钮标签。
# 显示在 PrettyChatEditDialog 中的重置按钮上。
feature.pretty-chat.settings.reset-default=恢复默认

# 保存脚本编辑器中所作更改的按钮标签。
# 显示在 PrettyChatEditDialog 中的保存按钮上。
feature.pretty-chat.settings.save=保存

# 彩虹渐变格式化器的显示名称。
# 显示在 PrettyChatSettingsView 中的彩虹格式化器卡片上。
pretty-chat.prettier.rainbow.name=彩虹渐变

# 彩虹渐变格式化器的描述。
# 显示在 PrettyChatSettingsView 中的彩虹格式化器卡片上。
pretty-chat.prettier.rainbow.desc=使用动态彩虹颜色标签为每个词着色。

# UwU可爱化格式化器的显示名称。
# 显示在 PrettyChatSettingsView 中的 UwUifier 格式化器卡片上。
pretty-chat.prettier.uwu.name=UwU可爱化

# UwU可爱化格式化器的描述。
# 显示在 PrettyChatSettingsView 中的 UwUifier 格式化器卡片上。
pretty-chat.prettier.uwu.desc=将 r 与 l 替换为 w 并添加可爱的颜文字后缀。

# 阴阳怪气波浪大小写格式化器的显示名称。
# 显示在 PrettyChatSettingsView 中的 Mocking 格式化器卡片上。
pretty-chat.prettier.mocking.name=阴阳怪气

# 阴阳怪气格式化器的描述。
# 显示在 PrettyChatSettingsView 中的 Mocking 格式化器卡片上。
pretty-chat.prettier.mocking.desc=交替变换大小写的嘲讽嘲弄风格。

# 全大写格式化器的显示名称。
# 显示在 PrettyChatSettingsView 中的 CAPS LOCK 格式化器卡片上。
pretty-chat.prettier.caps.name=全大写

# 全大写格式化器的描述。
# 显示在 PrettyChatSettingsView 中的 CAPS LOCK 格式化器卡片上。
pretty-chat.prettier.caps.desc=将所有英文字母转换为大写。

# 全小写格式化器的显示名称。
# 显示在 PrettyChatSettingsView 中的 lowercase 格式化器卡片上。
pretty-chat.prettier.lowercase.name=全小写

# 全小写格式化器的描述。
# 显示在 PrettyChatSettingsView 中的 lowercase 格式化器卡片上。
pretty-chat.prettier.lowercase.desc=将所有英文字母转换为小写。

# 文本倒置格式化器的显示名称。
# 显示在 PrettyChatSettingsView 中的 Reverse 格式化器卡片上。
pretty-chat.prettier.reverse.name=文本倒置

# 文本倒置格式化器的描述。
# 显示在 PrettyChatSettingsView 中的 Reverse 格式化器卡片上。
pretty-chat.prettier.reverse.desc=逐字倒序排列文本内容。

# 小型大写字母格式化器的显示名称。
# 显示在 PrettyChatSettingsView 中的 Small Caps 格式化器卡片上。
pretty-chat.prettier.smallcaps.name=小型大写

# 小型大写字母格式化器的描述。
# 显示在 PrettyChatSettingsView 中的 Small Caps 格式化器卡片上。
pretty-chat.prettier.smallcaps.desc=将字母转换为 Unicode 小型大写字母。

# 气泡文字格式化器的显示名称。
# 显示在 PrettyChatSettingsView 中的 Bubble 格式化器卡片上。
pretty-chat.prettier.bubble.name=气泡圆圈

# 气泡文字格式化器的描述。
# 显示在 PrettyChatSettingsView 中的 Bubble 格式化器卡片上。
pretty-chat.prettier.bubble.desc=将字符转换为带圆圈的气泡符号。

# 自定义脚本格式化器的显示名称。
# 显示在 PrettyChatSettingsView 中的 Custom Script 格式化器卡片上。
pretty-chat.prettier.custom.name=自定义脚本

# 自定义脚本格式化器的描述。
# 显示在 PrettyChatSettingsView 中的 Custom Script 格式化器卡片上。
pretty-chat.prettier.custom.desc=用户自定义的消息格式化模板或 JavaScript 脚本。

# 用于隐藏 HUD 界面元素拖动手柄的设置复选框标签。
# 显示在包含可拖动 HUD 覆盖层的功能设置对话框中。
feature.common.settings.hide-drag-handle=隐藏拖动手柄

# 聊天消息列表中显示的房间邀请卡片标题。
feature.chat.ui.room-invite=房间邀请

# 用于尝试从聊天邀请链接连接到未公开或离线房间的按钮标签。
feature.chat.ui.try-connect=尝试连接

# 用于直接从邀请链接卡片启用玩家直连功能的按钮标签。
feature.chat.ui.enable-player-connect=启用玩家直连

# 当房间邀请链接当前未在活跃公开房间列表中时显示的状态消息。
feature.chat.ui.unlisted-offline=未列出或已离线

# 表示加入房间前需要安装额外或缺失模组的状态徽标。
feature.chat.ui.mods-required=需要特定模组

# 表示房间使用了不兼容的网络代理协议版本的状态徽标。
feature.chat.ui.incompatible-protocol=协议不兼容
