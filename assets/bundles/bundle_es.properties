# Description explaining the follow unit camera toggle.
feature.autoplay.settings.follow-unit.description=Mantenga la cámara centrada en la unidad del reproductor mientras la reproducción automática la controla.
# Header for the prioritized task list in settings.
feature.autoplay.settings.tasks=Prioridades de tarea
# Description explaining task priority ordering. The same order renders top-to-bottom in settings and left-to-right then top-to-bottom in the 5-column HUD and popup grid.
feature.autoplay.settings.tasks.description=Las tareas se evalúan en orden: de arriba a abajo en la configuración, de izquierda a derecha en el HUD y la cuadrícula emergente. Utilice los botones Arriba/Abajo o arrastre los iconos para reordenar la prioridad.
