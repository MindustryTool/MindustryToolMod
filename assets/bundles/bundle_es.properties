# Hint shown in settings explaining the HUD and popup strip. Tap the master button to toggle autoplay, tap a task icon to toggle that task.
feature.autoplay.hud.reorder-hint=En el HUD y la cuadrícula emergente, toque el botón maestro para alternar la reproducción automática y toque el ícono de una tarea para alternar esa tarea. Reordenar la prioridad en la configuración.

