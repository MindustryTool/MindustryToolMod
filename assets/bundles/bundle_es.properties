# Displayed as the title/name of the Autoplay feature in the features dialog and HUD.
feature.autoplay=Reproducción automática
# Displayed as the name of the Autoplay feature.
feature.autoplay.name=Reproducción automática
# Displayed as the description of the Autoplay feature.
feature.autoplay.description=IA autónoma que controla la unidad del jugador para curar, luchar, reparar, construir y minar.
# Displayed as the help text for the Autoplay feature.
feature.autoplay.help=Gestiona automáticamente su unidad en función de prioridades de tareas configurables. Produce control cuando se detecta una entrada manual.

# Displayed as the title of the Autoplay settings dialog.
