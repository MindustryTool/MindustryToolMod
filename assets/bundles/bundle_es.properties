# Help text explaining the Custom Music feature.
# Displayed in FeatureHelpDialog when inspecting the music feature.
feature.music.help=Carga archivos de audio personalizados (.mp3, .ogg, .wav) en la música ambiental, oscura, de jefe, de menú y de editor. Las pistas se copian en el almacenamiento del mod, se pueden obtener una vista previa con los botones de reproducción y se pueden desactivar individualmente sin eliminarlas. La música del menú y del editor selecciona una pista personalizada habilitada aleatoriamente cada vez que se abre el menú o el editor.

