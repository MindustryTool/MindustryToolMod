feature.autoplay.settings.display-mode.hud=HUD
# Label for the popup display-mode option in AutoplaySettingsDialog. Shows the strip as an on-demand QuickAccess popup.
feature.autoplay.settings.display-mode.popup=ventana emergente
# Label for the HUD and popup scale slider in AutoplaySettingsDialog. Range is 50% to 150%.
feature.autoplay.settings.scale=Escala
# Label for the button that resets the Autoplay HUD position to the screen center.
feature.autoplay.settings.reset-position=Restablecer la posición del HUD
# Tooltip for the master autoplay toggle button in the HUD and popup strip. Toggles the whole feature without changing task toggles.
