# Section header listing the custom tracks registered in the dark music rotation.
feature.music.section.dark=Oscuro

# Section header listing the custom tracks registered in the boss music rotation.
feature.music.section.boss=Jefe

# Section header listing the custom tracks that replace the menu music.
