# Displayed in FeatureHelpDialog when inspecting the camera zoom feature.
feature.camera-zoom.help=Ajuste el zoom mínimo y máximo de la cámara con los controles deslizantes. Se aplican límites mientras se juega y pueden ir más allá del rango de zoom básico. Mientras están habilitados, estos límites anulan los multiplicadores de zoom de gráficos básicos. Si los controles deslizantes se cruzan, el otro límite se empuja para que coincida.
