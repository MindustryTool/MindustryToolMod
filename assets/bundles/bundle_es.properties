feature.camera-zoom.settings.min-zoom=Zoom mínimo
# Label for the maximum zoom slider.
# Displayed next to the slider; larger values allow zooming further in.
feature.camera-zoom.settings.max-zoom=Zoom máximo
# Label for the button that resets zoom limits back to vanilla defaults.
# Displayed on the reset button in CameraZoomSettingsDialog.
feature.camera-zoom.settings.reset=Restablecer los valores predeterminados

