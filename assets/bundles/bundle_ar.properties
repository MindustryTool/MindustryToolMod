# Title of the dialog shown when a newer mod version is available.
# Displayed as the header of the update-available dialog.
update.dialog.title=التحديث متاح
# Message informing the user that a new version is available.
# Displayed in the update dialog's version banner.
# {0} is the current version (colored red), {1} is the latest version (colored green).
update.message.new-version=الإصدار الجديد متاح: {0} -> {1}
# Label for the button that dismisses the update dialog without updating.
# Displayed on the Cancel button in the update dialog.
update.button.cancel=يلغي
# Label for the button that starts the mod update via GitHub import.
# Displayed on the Update button in the update dialog.
update.button.update=تحديث
# Label showing the summed download count for a release's assets.
# Displayed under each release entry in the changelog.
# {0} is the total download count (integer).
update.changelog.download-count=عدد التنزيلات: {0}
# Error message shown when fetching release notes fails without HTTP details.
# Displayed as changelog fallback when GitHub releases cannot be fetched.
update.error.fetch-releases=تعذر جلب ملاحظات الإصدار.
# Error message shown when fetching release notes fails with HTTP detail.
# Displayed as changelog fallback; {0} is the HTTP error body/status text.
update.error.fetch-releases-with-status=تعذر جلب ملاحظات الإصدار: {0}
# Error message shown when release notes JSON cannot be parsed.
# Displayed as changelog fallback when GitHub response is malformed.
update.error.parse-releases=تعذر تحليل ملاحظات الإصدار.
# Placeholder text shown when a release has no body/description.
# Displayed in the changelog entry when GitHub release body is empty.
update.label.no-description=لم يتم تقديم أي وصف.
# Log/status message indicating the mod is already up to date.
# Used in log output when no update is required; may be shown in UI in future.
update.status.up-to-date=وزارة الدفاع حتى الآن
# Log/status message indicating an update is required.
# Used in log output when a newer version is found.
# {0} is the current version, {1} is the latest version.
update.status.require-update=يتطلب التعديل التحديث، الإصدار الحالي: {0}، الإصدار الأحدث: {1}
# Title of the login dialog shown during the authentication flow.
# Displayed as the header of AuthLoginDialog.
auth.login.dialog-title=تسجيل الدخول
# Label for the cancel button in the login dialog.
# Displayed on the Cancel button; dismisses the dialog and cancels the pending login.
auth.login.cancel=يلغي
# Message shown inside the login dialog while the login URL is being fetched.
# Displayed as a loading indicator before the login link appears.
auth.login.loading=جارٍ إنشاء رابط تسجيل الدخول...
# Label for the button that displays the login URL.
# Displayed after getLoginUri succeeds; clicking copies the URL to clipboard.
# {0} is the login URL returned by the server.
auth.login.login-url={0}
# Toast message shown when the login URL is copied to the clipboard.
# Displayed briefly after clicking the login URL button.
auth.login.copied=منقول
# Toast message shown when login succeeds after polling the login token.
# Displayed after pollLoginToken returns tokens and session is fetched.
auth.login.success=تم تسجيل الدخول بنجاح!
# Title of the failure dialog shown when login fails or the polling times out.
# Displayed with a Retry option when loginFuture completes exceptionally (except on cancel).
auth.login.failed=فشل تسجيل الدخول أو انتهت المهلة.
# Error detail shown when login polling exceeds the timeout.
# Displayed in the failure dialog when polling retries past the login expiry without approval.
auth.login.timeout=انتهت مهلة تسجيل الدخول. يرجى المحاولة مرة أخرى.
# Toast shown when the browser cannot be opened automatically during login.
# Displayed after the login link is copied to the clipboard so the user can open it manually.
auth.login.browser-fallback=تعذر فتح المتصفح، تم نسخ رابط تسجيل الدخول إلى الحافظة.
# Label for the logout action.
# Used as a fallback for logout-related UI where no specific context is needed.
auth.logout=تسجيل الخروج
# Title of the confirmation dialog asking the user to confirm logout.
# Displayed as the header of the logout confirm dialog.
auth.logout.confirm-title=تسجيل الخروج
# Message inside the logout confirmation dialog.
# Displayed when an authenticated user clicks their name/avatar; {0} is the logged-in user's display name.
auth.logout.confirm-message=تم تسجيل الدخول كـ {0}\n هل تريد تسجيل الخروج؟
# Label shown in the auth overlay while the user session is being loaded.
# Displayed when SessionLoadEvent isLoading=true.
auth.session.loading=تحميل...
# Label prefix shown when the session fails to load.
# Displayed in the auth overlay when SessionLoadEvent carries an error, before the error message.
auth.session.error=خطأ
# Label for the retry button shown when session loading fails.
# Displayed in the auth overlay error state; clicking re-initiates login.
auth.session.retry=أعد المحاولة

