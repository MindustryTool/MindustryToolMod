feature.time-control.help=Переключает скорость игры между замедлением и ускорением во время игры. Доступно только при хостинге или в одиночной игре; скорость автоматически сбрасывается на 1x при подключении в качестве клиента, выходе из мира или переключении режима взаимодействия.

