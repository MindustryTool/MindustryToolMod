# Title of the login dialog shown during the authentication flow.
# Displayed as the header of AuthLoginDialog.
auth.login.dialog-title=Logowanie
# Label for the cancel button in the login dialog.
# Displayed on the Cancel button; dismisses the dialog and cancels the pending login.
auth.login.cancel=Anuluj
# Message shown inside the login dialog while the login URL is being fetched.
# Displayed as a loading indicator before the login link appears.
auth.login.loading=Generowanie linku do logowania...
# Label for the button that displays the login URL.
# Displayed after getLoginUri succeeds; clicking copies the URL to clipboard.
# {0} is the login URL returned by the server.
auth.login.login-url={0}
# Toast message shown when the login URL is copied to the clipboard.
# Displayed briefly after clicking the login URL button.
auth.login.copied=Skopiowano
# Toast message shown when login succeeds after polling the login token.
# Displayed after pollLoginToken returns tokens and session is fetched.
auth.login.success=Logowanie pomyślne!
# Title of the failure dialog shown when login fails or the polling times out.
# Displayed with a Retry option when loginFuture completes exceptionally (except on cancel).
auth.login.failed=Logowanie nie powiodło się lub upłynął limit czasu.
# Error detail shown when login polling exceeds the timeout.
# Displayed in the failure dialog when polling retries past the login expiry without approval.
auth.login.timeout=Upłynął limit czasu logowania. Spróbuj ponownie.
# Toast shown when the browser cannot be opened automatically during login.
# Displayed after the login link is copied to the clipboard so the user can open it manually.
auth.login.browser-fallback=Nie udało się otworzyć przeglądarki, link logowania skopiowano do schowka.
# Label for the logout action.
# Used as a fallback for logout-related UI where no specific context is needed.
auth.logout=Wyloguj
# Title of the confirmation dialog asking the user to confirm logout.
# Displayed as the header of the logout confirm dialog.
auth.logout.confirm-title=Wyloguj
# Message inside the logout confirmation dialog.
# Displayed when an authenticated user clicks their name/avatar; {0} is the logged-in user's display name.
auth.logout.confirm-message=Zalogowano jako {0}
Czy chcesz się wylogować?
# Label shown in the auth overlay while the user session is being loaded.
# Displayed when SessionLoadEvent isLoading=true.
auth.session.loading=Wczytywanie...
# Label prefix shown when the session fails to load.
# Displayed in the auth overlay when SessionLoadEvent carries an error, before the error message.
auth.session.error=Błąd
# Label for the retry button shown when session loading fails.
# Displayed in the auth overlay error state; clicking re-initiates login.
auth.session.retry=Ponów

