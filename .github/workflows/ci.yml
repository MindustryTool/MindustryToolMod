name: CI/CD Pipeline

on:
  push:
    branches:
      - '**'
    tags:
      - 'v*'
  pull_request:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  quality-check:
    name: Quality & Verification
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: 17
          distribution: temurin

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Run verification checks (Checkstyle, Tests, Bundle Check)
        run: ./gradlew check --parallel

  build-package:
    name: Build & Package
    needs: quality-check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Android build tools
        run: echo "${ANDROID_HOME}/build-tools/34.0.0" >> $GITHUB_PATH

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: 17
          distribution: temurin

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Universal Mod JAR
        run: ./gradlew deploy --parallel

      - name: Upload PR Artifact
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: MindustryToolMod-PR-${{ github.event.pull_request.number }}
          path: build/libs/MindustryToolMod.jar
          if-no-files-found: error
          retention-days: 7

      - name: Stash Built JAR for Release
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/dev' || startsWith(github.ref, 'refs/tags/v'))
        uses: actions/upload-artifact@v4
        with:
          name: release-jar
          path: build/libs/MindustryToolMod.jar
          if-no-files-found: error
          retention-days: 1

  publish-release:
    name: Publish GitHub Release
    needs: build-package
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/dev' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download Built JAR
        uses: actions/download-artifact@v4
        with:
          name: release-jar
          path: build/libs

      - name: Determine Version and Release Tag
        id: version
        env:
          REF: ${{ github.ref }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          VERSION=$(grep -E '^[[:space:]]*version:' mod.hjson | sed -E 's/^[[:space:]]*version:[[:space:]]*"?([^"[:space:]]+)"?.*/\1/')
          if [ -z "$VERSION" ]; then
            echo "Error: Could not extract version from mod.hjson" >&2
            exit 1
          fi
          echo "Extracted version: $VERSION"
          if [[ "$REF" == refs/tags/* ]]; then
            # Tag push: respect the pushed tag so beta/stable channels stay isolated.
            TAG="$REF_NAME"
            if [[ "$REF_NAME" == *"-beta"* ]]; then
              PRERELEASE="true"
            else
              PRERELEASE="false"
            fi
          elif [[ "$REF_NAME" == "main" ]]; then
            TAG="${VERSION}"
            PRERELEASE="false"
          else
            TAG="${VERSION}-beta"
            PRERELEASE="true"
          fi
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "prerelease=${PRERELEASE}" >> "$GITHUB_OUTPUT"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Generate Release Notes
        id: notes
        env:
          TAG: ${{ steps.version.outputs.tag }}
          PRERELEASE: ${{ steps.version.outputs.prerelease }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git fetch --tags --force

          # Resolve the previous release on the SAME channel (stable vs beta isolated).
          # The old `git describe HEAD` fallback was branch-dependent: main's tags are
          # unreachable from dev (branches diverged), so beta notes fell back to an
          # ancient tag and re-listed ~200 already-shipped commits.
          PREV_TAG=""
          if [ "$PRERELEASE" = "true" ]; then
            PREV_TAG=$(gh release list --exclude-drafts --limit 100 --json tagName,isPrerelease \
              -q '.[] | select(.isPrerelease == true) | .tagName' 2>/dev/null | grep -vxF -- "$TAG" | head -n 1 || true)
            if [ -z "$PREV_TAG" ]; then
              PREV_TAG=$(git tag --list '*-beta' --sort=-creatordate 2>/dev/null | grep -vxF -- "$TAG" | head -n 1 || true)
            fi
          else
            PREV_TAG=$(gh release list --exclude-drafts --limit 100 --json tagName,isPrerelease \
              -q '.[] | select(.isPrerelease == false) | .tagName' 2>/dev/null | grep -vxF -- "$TAG" | head -n 1 || true)
            if [ -z "$PREV_TAG" ]; then
              PREV_TAG=$(git tag --list --sort=-creatordate 2>/dev/null | grep -v '\-beta$' | grep -vxF -- "$TAG" | head -n 1 || true)
            fi
          fi
          # The current TAG is excluded above so re-pushes without a version bump
          # still diff against the last *different* release instead of themselves.
          if [ -n "$PREV_TAG" ] && ! git cat-file -e "${PREV_TAG}^{commit}" 2>/dev/null; then
            echo "Previous tag $PREV_TAG not found locally, ignoring."
            PREV_TAG=""
          fi
          echo "Previous tag resolved: $PREV_TAG"

          if [ -n "$PREV_TAG" ]; then
            COMMITS=$(git log "${PREV_TAG}..HEAD" --no-merges --pretty=format:"- %s")
          else
            COMMITS=$(git log -n 15 --no-merges --pretty=format:"- %s")
          fi

          if [ -z "$COMMITS" ]; then
            COMMITS="- Maintenance and bug fixes."
          fi

          # Output multiline string to GITHUB_OUTPUT
          EOF=$(dd if=/dev/urandom bs=15 count=1 status=none | base64)
          echo "changelog<<$EOF" >> "$GITHUB_OUTPUT"
          echo "$COMMITS" >> "$GITHUB_OUTPUT"
          echo "$EOF" >> "$GITHUB_OUTPUT"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: ${{ steps.version.outputs.tag }}
          prerelease: ${{ steps.version.outputs.prerelease == 'true' }}
          body: ${{ steps.notes.outputs.changelog }}
          files: build/libs/MindustryToolMod.jar
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
